<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Level 2</title>
  <style>
    div {
      height: 100px;
      width: 100px;
      background-color: pink;
      border-width: 2px;
      border-style: solid;
      background-color:green;
       border: 2px solid brown;

  <button>click me</button>
  <div>
    This is div
  </div>

</html>
