
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #173b65;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            color: #173b65;
        }
    </style>
</head>
<body>

    <h1>My Image Gallery</h1>
    <p>Welcome to my first HTML design!</p>

    <div class="gallery">

        <div class="card">
            <img src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <h3>Mountain</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1011/400/300" alt="Nature">
            <h3>Nature</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <h3>Animal</h3>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1039/400/300" alt="River">
            <h3>River</h3>
        </div>

    </div>

</body>
</html>
