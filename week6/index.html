<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 6 - CSS Box Model</title>

  <style>
    /* 6.1: Box sizing */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
    }

    .top-bar {
      background-color: #1e293b;
      color: white;
      padding: 18px;
      border: 2px solid #0f172a;
      margin-bottom: 25px;
    }

    .box-demo {
      background-color: white;
      padding: 25px;
      border: 4px solid #2563eb;
      margin: 20px 0;
      border-radius: 8px;
    }

    .box-demo p {
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <h1>My Profile Cards</h1>
    <p>Week 6 CSS Assignment</p>
  </header>

  <main>
    <section class="box-demo">
      <h2>6.1 - CSS Box Model</h2>
      <p>
        The CSS box model consists of content, padding,
        border and margin. Box sizing is set to border-box.
      </p>
      <p>
        Open browser DevTools, inspect this box, and view
        the Box Model diagram.
      </p>
    </section>
  </main>
</body>
</html>
