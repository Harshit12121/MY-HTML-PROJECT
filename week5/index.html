 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Slectors</title>

  <style>
  /* 1. Universal selector: all elements */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
 /* 2. Elements selector : all h1 headings */
 h1 {
  color: blue;
  text-align: center;
 }

 /* 3. Class selector: Elemet with class="card" */
 .card {
     background-color: lightblue;
     margin: 20px;
     padding: 15px;
     border: 1px solid blue;
 }

 /* 4. ID selector:Element with id="hero" */
 #hero {
  background-color: lightyellow;
  padding:25px;
  text-align: center;
 }
  </style>
 </head>
 <body>

  <section id="hero">
    <h1>Welcom to my Website</h1>
    <p>This is my hero section</p>
  </section>

  <div class="card">
    <h2>My Skills</h2>
    <p>I know java, HTML & CSS.</p>
  </div>

   <div class="card">
    <h2>My Education</h2>
    <p>I am studying B.Tech CSE</p>
   </div>

 </body>
 </html>
