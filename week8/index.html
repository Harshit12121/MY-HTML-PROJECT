<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - CSS Grid Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="head">
            <h1>My Dashboard</h1>
            <p>Welcome to My Website</p>
        </header>

        <!-- Sidebar -->
        <aside class="side">
            <h2>Menu</h2>
            <p>🏠 Home</p>
            <p>👤 Profile</p>
            <p>⚙️ Settings</p>
            <p>📞 Contact</p>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <h2>My Dashboard Cards</h2>

            <div class="grid-container">

                <div class="card">
                    <span class="icon">📚</span>
                    <span>Education</span>
                </div>

                <div class="card">
                    <span class="icon">💻</span>
                    <span>Projects</span>
                </div>

                <div class="card">
                    <span class="icon">🎯</span>
                    <span>My Goals</span>
                </div>

                <div class="card">
                    <span class="icon">📊</span>
                    <span>Progress</span>
                </div>

                <div class="card">
                    <span class="icon">📝</span>
                    <span>Assignments</span>
                </div>

                <div class="card">
                    <span class="icon">🏆</span>
                    <span>Achievements</span>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer class="foot">
            <p>© 2026 My Dashboard | All Rights Reserved</p>
        </footer>

    </div>

</body>
</html>
